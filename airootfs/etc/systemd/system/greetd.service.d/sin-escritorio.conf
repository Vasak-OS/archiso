# El primer camino: greetd se rindió.
#
# `Restart=always` con `StartLimitBurst=5` en treinta segundos significa que
# greetd reintenta cinco veces y después queda en fallo. En ese momento no hay
# ni sesión gráfica en el vt7 ni consola en el tty1 —greetd la había detenido
# con su `Conflicts=getty@tty1.service` y no vuelve sola—, así que la pantalla
# se queda en lo último que imprimió el kernel.
[Unit]
OnFailure=vasak-sin-escritorio.service
