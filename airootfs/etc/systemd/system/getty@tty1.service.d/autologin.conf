# La consola de rescate del ISO en vivo.
#
# Decía `--autologin lynx`, y en el ISO **no existe ningún usuario `lynx`**:
# el de la sesión en vivo es `vasak` y el nombre aparecía una sola vez en todo
# el repositorio. O sea que el inicio automático fallaba siempre en PAM y tty1
# no daba ninguna sesión — justo la tecla que alguien aprieta cuando la
# pantalla queda negra.
#
# Va `root` y no `vasak`, igual que el perfil `releng` de archiso: esto es la
# consola a la que se llega cuando el escritorio no arrancó, y ahí hace falta
# poder leer el registro del sistema sin que nada pida una contraseña que nadie
# tiene. En un medio en vivo no agrega ningún acceso: la sesión gráfica ya
# entra sola y `root` ya tiene la contraseña vacía.
#
# `--noreset` y `- ${TERM}` también son de `releng`. Lo que había —`%I 38400
# linux`— fija el tipo de terminal a `linux`, que es cierto en una consola de
# video y falso en una serie, que es por donde se saca el registro de una
# máquina virtual sin pantalla.
[Service]
ExecStart=
ExecStart=-/usr/bin/agetty --noreset --noclear --autologin root - ${TERM}
