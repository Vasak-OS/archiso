# `audit=0` en todas las entradas: sin eso la consola del medio en vivo queda
# ilegible.
#
# Cargar los perfiles de AppArmor genera registros de audit con contexto de
# sujeto, y ahí el kernel falla y lo escribe por consola. Medido arrancando el
# ISO del 14/09/2026: **1151 veces en un solo arranque**.
#
#     audit: error in audit_log_subj_ctx
#
# No es un problema nuestro —`security_secid_to_secctx()` falla en el kernel—
# pero sí está en nuestras manos no pedirle que lo intente mil veces. Con
# `audit=0` medido: 1151 → 0.
#
# Importa más de lo que parece: una consola tapada por mil líneas de kernel es
# una consola donde el mensaje de `vasak-sin-escritorio` no se lee, y ése es el
# único cartel que hay cuando el escritorio no abre.
#
# El costo es que en el medio en vivo no se registran las denegaciones de
# AppArmor. En un ISO, donde además el servicio va enmascarado (ver
# `airootfs/etc/systemd/system/apparmor.service`), no hay nada que registrar.
# El sistema instalado no se entera de esto: lo arma `pacstrap` desde los
# repositorios y trae su propia línea de comandos.

LABEL arch64
TEXT HELP
Boot the VasakOS install on BIOS.
It allows you to install VasakOS or perform system maintenance.
ENDTEXT
MENU LABEL VasakOS install (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% lsm=landlock,lockdown,yama,integrity,bpf,apparmor audit=0

# Accessibility boot option
LABEL arch64speech
TEXT HELP
Boot the VasakOS install on BIOS with speakup screen reader.
It allows you to install VasakOS or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL VasakOS install (x86_64, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% accessibility=on lsm=landlock,lockdown,yama,integrity,bpf,apparmor audit=0

