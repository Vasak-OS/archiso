# LABEL existing
# TEXT HELP
# Boot an existing operating system.
# Press TAB to edit the disk and partition number to boot.
# ENDTEXT
# MENU LABEL Boot existing OS
# COM32 chain.c32
# APPEND hd0 0

# https://www.memtest.org/
# La ruta no lleva %INSTALL_DIR%: mkarchiso deja el binario en /boot/memtest86+/
# del propio ISO, fuera del directorio de instalación. Con la ruta vieja —la que
# tenía este archivo comentado— la entrada aparecía en el menú y no arrancaba.
LABEL memtest
MENU LABEL Run Memtest86+ (RAM test)
LINUX /boot/memtest86+/memtest

# # http://hdt-project.org/
# LABEL hdt
# MENU LABEL Hardware Information (HDT)
# COM32 hdt.c32
# APPEND modules_alias=hdt/modalias.gz pciids=hdt/pciids.gz

# LABEL reboot
# TEXT HELP
# Reboot computer.
# The computer's firmware must support APM.
# ENDTEXT
# MENU LABEL Reboot
# COM32 reboot.c32

# LABEL poweroff
# TEXT HELP
# Power off computer.
# The computer's firmware must support APM.
# ENDTEXT
# MENU LABEL Power Off
# COM32 poweroff.c32
